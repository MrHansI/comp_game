<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Комочек</title>
  <script src="aframe.min.js"></script>
  <script src="aframe-ar.js"></script>
  <style>
    body { margin: 0; overflow: hidden; }
  </style>
</head>
<body>
  <a-scene embedded arjs="sourceType: webcam; debugUIEnabled: false;">
    <a-marker preset="hiro">
      <a-entity
        gltf-model="monkey.glb"
        position="0 0 0"
        scale="0.1 0.1 0.1"
        rotation="0 180 0"
        animation="property: position.y; to: 1; dur: 500; easing: linear; loop: true; dir: alternate"
      ></a-entity>
    </a-marker>
    <a-entity camera></a-entity>
  </a-scene>
</body>
</html>
